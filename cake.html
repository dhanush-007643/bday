<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Make a Wish - Nisha's Birthday</title>
    
    <!-- Tailwind CSS for UI Layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js (Vanilla) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- GSAP for Smooth Transitions -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-cinzel: 'Cinzel', serif;
            --font-playfair: 'Playfair Display', serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #050b14; /* Fallback dark background */
            font-family: var(--font-playfair);
            user-select: none;
        }

        /* Magical Forest Background */
        #background {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background-image: url('https://images.unsplash.com/photo-1511497584788-876760111969?q=80&w=2532&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: brightness(0.4) contrast(1.2) blur(3px); /* Darkened for cinematic feel */
            z-index: 0;
        }

        /* Vignette overlay for depth */
        #vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.8) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* Three.js Canvas Container */
        #webgl-container {
            position: absolute;
            inset: 0;
            z-index: 5;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 12vh;
            pointer-events: none; /* Let clicks pass through to canvas if needed */
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(255, 215, 0, 0.05);
            border-radius: 24px;
            padding: 2rem 3rem;
            text-align: center;
            pointer-events: auto;
            max-width: 90vw;
            transition: all 0.5s ease;
        }

        /* Fantasy Buttons */
        .btn-fantasy {
            font-family: var(--font-cinzel);
            background: linear-gradient(to right, #b8860b, #daa520, #b8860b);
            background-size: 200% auto;
            color: #1a0f00;
            border: 1px solid #ffd700;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.4);
            transition: 0.4s;
            text-transform: uppercase;
        }

        .btn-fantasy:hover {
            background-position: right center;
            box-shadow: 0 0 30px rgba(218, 165, 32, 0.7);
            transform: translateY(-2px);
            color: #000;
        }

        .btn-fantasy:active {
            transform: translateY(1px);
        }

        .hidden-initial {
            display: none;
            opacity: 0;
        }
    </style>
</head>
<body>

    <div id="background"></div>
    <div id="vignette"></div>
    
    <!-- Three.js renders here -->
    <div id="webgl-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div id="interaction-card" class="glass-panel">
            
            <!-- Initial State -->
            <div id="state-blow">
                <h1 class="text-3xl md:text-5xl text-yellow-500 mb-2" style="font-family: var(--font-cinzel); text-shadow: 0 2px 10px rgba(0,0,0,0.8);">
                    Make a wish...
                </h1>
                <p class="text-yellow-100/70 italic text-lg mb-8">Close your eyes and think of something beautiful.</p>
                <button id="btn-blow" class="btn-fantasy">
                    Blow The Candles 🕯️
                </button>
            </div>

            <!-- Post-Blow State (Initially Hidden) -->
            <div id="state-wished" class="hidden-initial">
                <h2 class="text-2xl md:text-3xl text-yellow-400 mb-6 leading-relaxed" style="text-shadow: 0 2px 10px rgba(0,0,0,0.8);">
                    "Nee wish pannadhu vida innum better things un life-la nadakkanum. ✨"
                </h2>
                <button id="btn-next" class="btn-fantasy" style="background: linear-gradient(to right, #1a2a40, #2c3e50); color: #ffd700; border-color: rgba(255,215,0,0.4);">
                    Ready For The Final Surprise? →
                </button>
            </div>

        </div>
    </div>

    <script>
        // Setup Three.js Scene
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        
        // Camera setup
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 4.5, 9);
        
        // Renderer setup (Transparent background)
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Global Variables
        let isBlown = false;
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 4.5;
        
        const clock = new THREE.Clock();
        const flames = [];
        const pointLights = [];
        const smokeParticles = [];
        const candlePositions = [];

        // Ambient Light (Night time feel)
        const ambientLight = new THREE.AmbientLight(0x2c3e50, 0.8);
        scene.add(ambientLight);

        // Moonlight (Directional)
        const moonLight = new THREE.DirectionalLight(0xa0c4ff, 0.6);
        moonLight.position.set(-5, 10, -5);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 1024;
        moonLight.shadow.mapSize.height = 1024;
        scene.add(moonLight);

        const cakeGroup = new THREE.Group();
        cakeGroup.position.y = -1; // Center it vertically
        scene.add(cakeGroup);

        // Shared Materials
        const frostingMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xfff0f5, // Pastel cream
            roughness: 0.8,
            metalness: 0.1
        });
        
        const goldMaterial = new THREE.MeshStandardMaterial({
            color: 0xffd700,
            roughness: 0.2,
            metalness: 0.8
        });

        // 1. Base Plate (Wood/Dark Gold)
        const plateGeo = new THREE.CylinderGeometry(3, 3.1, 0.2, 64);
        const plateMat = new THREE.MeshStandardMaterial({ color: 0x3e2723, roughness: 0.9 });
        const plate = new THREE.Mesh(plateGeo, plateMat);
        plate.position.y = 0.1;
        plate.receiveShadow = true;
        plate.castShadow = true;
        cakeGroup.add(plate);

        // 2. Bottom Tier
        const tier1Geo = new THREE.CylinderGeometry(2.4, 2.4, 1.8, 64);
        const tier1 = new THREE.Mesh(tier1Geo, frostingMaterial);
        tier1.position.y = 1.1;
        tier1.receiveShadow = true;
        tier1.castShadow = true;
        cakeGroup.add(tier1);

        // 3. Top Tier
        const tier2Geo = new THREE.CylinderGeometry(1.6, 1.6, 1.4, 64);
        const tier2 = new THREE.Mesh(tier2Geo, frostingMaterial);
        tier2.position.y = 2.7; // 1.1 + (1.8/2) + (1.4/2)
        tier2.receiveShadow = true;
        tier2.castShadow = true;
        cakeGroup.add(tier2);

        // Gold trimming bottom tier
        const trim1Geo = new THREE.TorusGeometry(2.4, 0.08, 16, 100);
        const trim1 = new THREE.Mesh(trim1Geo, goldMaterial);
        trim1.rotation.x = Math.PI / 2;
        trim1.position.y = 0.25;
        trim1.castShadow = true;
        cakeGroup.add(trim1);

        // Gold trimming top tier
        const trim2Geo = new THREE.TorusGeometry(1.6, 0.06, 16, 100);
        const trim2 = new THREE.Mesh(trim2Geo, goldMaterial);
        trim2.rotation.x = Math.PI / 2;
        trim2.position.y = 2.05;
        trim2.castShadow = true;
        cakeGroup.add(trim2);

        // Sunflowers (Yellow spheres around the base)
        const sunflowerGeo = new THREE.SphereGeometry(0.25, 32, 32);
        const sunflowerMat = new THREE.MeshStandardMaterial({ color: 0xffa500, roughness: 0.6 });
        const numFlowers = 12;
        for (let i = 0; i < numFlowers; i++) {
            const angle = (i / numFlowers) * Math.PI * 2;
            const radius = 2.5;
            const flower = new THREE.Mesh(sunflowerGeo, sunflowerMat);
            flower.position.set(Math.cos(angle) * radius, 0.4, Math.sin(angle) * radius);
            
            // Add tiny brown core
            const core = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), new THREE.MeshStandardMaterial({color: 0x4a3728}));
            core.position.set(Math.cos(angle) * (radius+0.15), 0.45, Math.sin(angle) * (radius+0.15));
            
            cakeGroup.add(flower);
            cakeGroup.add(core);
        }

        const createCandle = (x, z) => {
            const candleGroup = new THREE.Group();
            candleGroup.position.set(x, 3.4, z); // Sit on top tier
            
            // Wax Body
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.06, 0.06, 0.8, 16),
                new THREE.MeshStandardMaterial({ color: 0xffe4e1, roughness: 0.4 }) // Pinkish white
            );
            body.position.y = 0.4;
            body.castShadow = true;
            candleGroup.add(body);

            // Wick
            const wick = new THREE.Mesh(
                new THREE.CylinderGeometry(0.01, 0.01, 0.1, 8),
                new THREE.MeshBasicMaterial({ color: 0x222222 })
            );
            wick.position.y = 0.85;
            candleGroup.add(wick);

            // Flame (Cone)
            const flame = new THREE.Mesh(
                new THREE.ConeGeometry(0.08, 0.25, 16),
                new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.9 }) // Glow material
            );
            flame.position.y = 0.98;
            candleGroup.add(flame);
            flames.push(flame); // Store for animation

            // Point Light for the flame
            const light = new THREE.PointLight(0xffa500, 1.2, 5); // Color, Intensity, Distance
            light.position.y = 1.0;
            light.castShadow = true;
            candleGroup.add(light);
            pointLights.push(light); // Store for animation
            
            // Save absolute world position of the wick for smoke spawning
            const worldPos = new THREE.Vector3();
            wick.getWorldPosition(worldPos);
            candlePositions.push({x: x, y: 3.4 + 0.85 - 1, z: z}); // Offset by cakeGroup.y (-1)

            cakeGroup.add(candleGroup);
        };

        // Create 6 candles in a circle
        const numCandles = 6;
        for (let i = 0; i < numCandles; i++) {
            const angle = (i / numCandles) * Math.PI * 2;
            const radius = 1.0;
            createCandle(Math.cos(angle) * radius, Math.sin(angle) * radius);
        }

        // Fireflies
        const firefliesGeo = new THREE.BufferGeometry();
        const firefliesCount = 60;
        const fireflyPositions = new Float32Array(firefliesCount * 3);
        const fireflyOffsets = new Float32Array(firefliesCount); // Random offset for sine wave

        for(let i = 0; i < firefliesCount * 3; i+=3) {
            fireflyPositions[i] = (Math.random() - 0.5) * 15;
            fireflyPositions[i+1] = Math.random() * 8;
            fireflyPositions[i+2] = (Math.random() - 0.5) * 15;
            fireflyOffsets[i/3] = Math.random() * Math.PI * 2;
        }

        firefliesGeo.setAttribute('position', new THREE.BufferAttribute(fireflyPositions, 3));
        firefliesGeo.setAttribute('aOffset', new THREE.BufferAttribute(fireflyOffsets, 1));

        // Custom minimal shader for glowing fireflies
        const firefliesMat = new THREE.PointsMaterial({
            size: 0.15,
            color: 0xffd700,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const fireflies = new THREE.Points(firefliesGeo, firefliesMat);
        scene.add(fireflies);

        // Smoke System (Prepared but invisible initially)
        const smokeGroup = new THREE.Group();
        scene.add(smokeGroup);
        
        const smokeGeo = new THREE.SphereGeometry(0.05, 8, 8);
        const smokeMat = new THREE.MeshBasicMaterial({ 
            color: 0xcccccc, 
            transparent: true, 
            opacity: 0.0,
            depthWrite: false 
        });

        // Pre-allocate 20 smoke particles per candle
        candlePositions.forEach(pos => {
            for(let i=0; i<20; i++) {
                const smoke = new THREE.Mesh(smokeGeo, smokeMat.clone());
                smoke.position.set(pos.x, pos.y, pos.z);
                smoke.userData = {
                    originX: pos.x,
                    originY: pos.y,
                    originZ: pos.z,
                    life: Math.random(), // 0 to 1
                    speed: Math.random() * 0.01 + 0.01,
                    driftX: (Math.random() - 0.5) * 0.02,
                    driftZ: (Math.random() - 0.5) * 0.02
                };
                smokeGroup.add(smoke);
                smokeParticles.push(smoke);
            }
        });

        // Mouse Tracking for Parallax
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // Touch support for mobile parallax
        document.addEventListener('touchmove', (event) => {
            mouseX = (event.touches[0].clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.touches[0].clientY / window.innerHeight) * 2 + 1;
        });

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Blow out interaction
        const btnBlow = document.getElementById('btn-blow');
        const stateBlow = document.getElementById('state-blow');
        const stateWished = document.getElementById('state-wished');

        btnBlow.addEventListener('click', () => {
            if (isBlown) return;
            isBlown = true;

            // 1. Animate Flames Shrinking out
            flames.forEach(flame => {
                // GSAP animation to bend and shrink the flame
                gsap.to(flame.rotation, { z: Math.PI / 4, duration: 0.2, ease: "power1.inOut" });
                gsap.to(flame.scale, { x: 0, y: 0, z: 0, duration: 0.4, delay: 0.1, ease: "back.in(2)" });
            });

            // 2. Dim Point Lights
            pointLights.forEach(light => {
                gsap.to(light, { intensity: 0, duration: 0.5, ease: "power2.out" });
            });

            // 3. Trigger Golden Confetti Burst
            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.4 },
                colors: ['#FFD700', '#FFA500', '#FF8C00', '#ffffff'],
                disableForReducedMotion: true
            });

            // 4. Update UI Layer
            gsap.to(stateBlow, { 
                opacity: 0, 
                y: -20, 
                duration: 0.5, 
                onComplete: () => {
                    stateBlow.style.display = 'none';
                    stateWished.style.display = 'block';
                    // Fade in new message
                    gsap.fromTo(stateWished, 
                        { opacity: 0, y: 20 }, 
                        { opacity: 1, y: 0, duration: 0.8, delay: 0.2, ease: "power2.out" }
                    );
                }
            });
        });

        const animate = () => {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // 1. Smooth Camera Parallax (~10 degrees rotation based on mouse)
            targetX = mouseX * 2;
            targetY = 4.5 + (mouseY * 0.5); // Slight vertical movement
            
            camera.position.x += (targetX - camera.position.x) * 0.05;
            camera.position.y += (targetY - camera.position.y) * 0.05;
            camera.lookAt(0, 1.5, 0); // Always look at the center of the cake

            // 2. Animate Fireflies
            const positions = firefliesGeo.attributes.position.array;
            for(let i = 0; i < firefliesCount; i++) {
                const i3 = i * 3;
                // Gentle floating sine wave movement
                positions[i3 + 1] += Math.sin(elapsedTime + fireflyOffsets[i]) * 0.005;
                positions[i3] += Math.cos(elapsedTime * 0.5 + fireflyOffsets[i]) * 0.005;
            }
            firefliesGeo.attributes.position.needsUpdate = true;

            // 3. Flicker Flames & Lights (if not blown)
            if (!isBlown) {
                // Global flicker math
                const flicker = Math.sin(elapsedTime * 20) * 0.05 + Math.sin(elapsedTime * 10) * 0.05 + 1;
                
                flames.forEach(flame => {
                    flame.scale.set(flicker, flicker * 1.1, flicker);
                });
                
                pointLights.forEach(light => {
                    light.intensity = 1.2 * flicker;
                });
            } else {
                // 4. Animate Smoke (if blown)
                smokeParticles.forEach(smoke => {
                    const ud = smoke.userData;
                    ud.life += 0.01;
                    
                    if (ud.life > 1) {
                        // Reset particle
                        ud.life = 0;
                        smoke.position.set(ud.originX, ud.originY, ud.originZ);
                    } else {
                        // Move up and drift
                        smoke.position.y += ud.speed;
                        smoke.position.x += ud.driftX;
                        smoke.position.z += ud.driftZ;
                        
                        // Grow slightly
                        const scale = 1 + ud.life * 2;
                        smoke.scale.set(scale, scale, scale);
                        
                        // Fade in then out
                        const opacity = Math.sin(ud.life * Math.PI) * 0.4;
                        smoke.material.opacity = opacity;
                    }
                });
            }

            renderer.render(scene, camera);
        };

        // Start Loop
        animate();
    </script>
</body>
</html>
